name: ClickUp — Released → Prod

on:
  release:
    types:
      - published

jobs:
  update-clickup-to-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed to compare tags

      - name: Extract ClickUp Task IDs from commits since last release
        id: extract
        run: |
          # Get the current tag
          CURRENT_TAG="${{ github.event.release.tag_name }}"
          echo "Current release tag: $CURRENT_TAG"

          # Get the previous tag (the one before this release)
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found — scanning last 50 commits"
            COMMIT_RANGE="HEAD~50..HEAD"
          else
            echo "Comparing $PREVIOUS_TAG → $CURRENT_TAG"
            COMMIT_RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
          fi

          # Extract all unique ClickUp task IDs in that range
          TASK_IDS=$(git log $COMMIT_RANGE --pretty=format:"%s %b" | grep -oP '(?i)CU-\K[a-z0-9]+' | sort -u | tr '\n' ' ')

          if [ -z "$TASK_IDS" ]; then
            echo "No ClickUp Task IDs found in commits for this release. Skipping."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Found Task IDs: $TASK_IDS"
            echo "task_ids=$TASK_IDS" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Update ClickUp tasks to Prod
        if: steps.extract.outputs.found == 'true'
        run: |
          for TASK_ID in ${{ steps.extract.outputs.task_ids }}; do
            echo "Updating task: $TASK_ID → prod"

            RESPONSE=$(curl -s -o /tmp/clickup_${TASK_ID}.json -w "%{http_code}" \
              -X PUT "https://api.clickup.com/api/v2/task/${TASK_ID}" \
              -H "Authorization: ${{ secrets.CLICKUP_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"status": "prod"}')

            echo "HTTP Status for $TASK_ID: $RESPONSE"
            cat /tmp/clickup_${TASK_ID}.json

            if [ "$RESPONSE" -eq 200 ]; then
              echo "✅ Task $TASK_ID → Prod"
            else
              echo "⚠️ Failed to update task $TASK_ID (HTTP $RESPONSE)"
            fi
          done
