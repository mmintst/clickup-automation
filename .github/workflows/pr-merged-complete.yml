name: ClickUp — PR Merged → Complete

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  pull-requests: write

jobs:
  update-clickup-status:
    # Only runs when the PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract ClickUp Task ID from PR title
        id: extract
        run: |
          # Looks for CU-xxxxxxx pattern in the PR title
          TASK_ID=$(echo "${{ github.event.pull_request.title }}" | grep -oP '(?i)CU-\K[a-z0-9]+' | head -1)

          if [ -z "$TASK_ID" ]; then
            echo "No ClickUp Task ID found in PR title. Skipping."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Found Task ID: $TASK_ID"
            echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Update ClickUp task status to Complete
        if: steps.extract.outputs.found == 'true'
        run: |
          RESPONSE=$(curl -s -o /tmp/clickup_response.json -w "%{http_code}" \
            -X PUT "https://api.clickup.com/api/v2/task/${{ steps.extract.outputs.task_id }}" \
            -H "Authorization: ${{ secrets.CLICKUP_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "complete"}')

          echo "HTTP Status: $RESPONSE"
          cat /tmp/clickup_response.json

          if [ "$RESPONSE" -ne 200 ]; then
            echo "Failed to update ClickUp task. Check your API token and task ID."
            exit 1
          fi

          echo "✅ ClickUp task ${{ steps.extract.outputs.task_id }} updated to Complete"

      - name: Post PR comment with ClickUp update
        if: steps.extract.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ ClickUp task **CU-${{ steps.extract.outputs.task_id }}** has been updated to **Complete**.`
            })
